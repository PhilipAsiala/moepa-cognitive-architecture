name: Feedback / Question
description: Ask a question or share feedback on the framework.
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Questions, feedback, and suggested edits belong here — not in a pull request.
        See [CONTRIBUTING.md](../../CONTRIBUTING.md).
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback or question
      description: What is unclear, inconsistent, missing, or worth reconsidering?
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Relevant document or section
      description: Optional. e.g. ARCHITECTURE.md §4.2, or docs/5-Layer-Evaluation-Checklist.md
    validations:
      required: false
