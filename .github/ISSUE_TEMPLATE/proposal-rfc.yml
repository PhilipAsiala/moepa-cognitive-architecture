name: Proposal / RFC
description: Propose a substantive change to the MOEPA model, scoring, or governance approach.
title: "[RFC] "
labels: ["proposal", "rfc"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for changes that affect the layer model, the scoring rubric, or the governance approach.
        **Do not open a pull request** — discuss here first. If accepted, the maintainer will implement on `main`.
        See [CONTRIBUTING.md](../../CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What gap, inconsistency, or limitation does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change as concretely as possible.
    validations:
      required: true
  - type: dropdown
    id: layers
    attributes:
      label: Layers affected
      multiple: true
      options:
        - Metrology
        - Ontology
        - Epistemology
        - Praxeology
        - Axiology
        - Data Substrate (DS1–DS7)
        - Agents (AG1–AG6)
        - Cross-cutting / Intake scorecard
        - None / Documentation only
    validations:
      required: true
  - type: dropdown
    id: scoring-impact
    attributes:
      label: Does this change scoring semantics?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: dropdown
    id: mcp-impact
    attributes:
      label: Does this affect MCP-first integration requirements?
      options:
        - "No"
        - "Yes"
        - "Not applicable (documentation-only)"
    validations:
      required: true
  - type: dropdown
    id: ingestion-impact
    attributes:
      label: Does this affect semantic ingestion or Proto-SPO requirements?
      options:
        - "No"
        - "Yes"
        - "Not applicable (documentation-only)"
    validations:
      required: true
  - type: textarea
    id: five-layer-impact
    attributes:
      label: Five-layer impact notes (if capability-related)
      description: Metrology, Ontology, Epistemology, Praxeology, Axiology — required when introducing or changing capabilities.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Other approaches you weighed and why you rejected them.
    validations:
      required: false
