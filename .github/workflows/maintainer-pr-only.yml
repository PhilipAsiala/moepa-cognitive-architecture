name: Maintainer PR Policy

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  close-external-pr:
    if: github.event.pull_request.user.login != 'PhilipAsiala'
    runs-on: ubuntu-latest
    steps:
      - name: Close external pull request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = [
              'Thanks for your interest in the MOEPA Cognitive Architecture.',
              '',
              'This repository uses an **issue-first** contribution model. Please **do not open pull requests** — open an issue instead so the change can be discussed before anything is merged to `main`.',
              '',
              '- [Feedback / Question](https://github.com/PhilipAsiala/philosophical-ai-architecture/issues/new?template=feedback.yml)',
              '- [Proposal / RFC](https://github.com/PhilipAsiala/philosophical-ai-architecture/issues/new?template=proposal-rfc.yml)',
              '',
              'See [CONTRIBUTING.md](https://github.com/PhilipAsiala/philosophical-ai-architecture/blob/main/CONTRIBUTING.md) for the full policy.',
              '',
              'You may fork and adapt under the MIT license for your own use without submitting a pull request here.',
              '',
              'This pull request is being closed automatically. If you already opened a related issue, link it in a comment on that issue.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              state: 'closed'
            });
